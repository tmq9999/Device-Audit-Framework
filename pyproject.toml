[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "device-audit-framework"
version = "0.9.0"
description = "Read-only, profile-driven Android evidence collection and offline consistency analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Device Audit Framework contributors"}]
keywords = ["adb", "android", "audit", "research", "forensics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.0,<9",
  "ruff>=0.4,<1",
]

[project.scripts]
device-audit = "device_audit.cli:main"

[tool.setuptools.packages.find]
include = ["device_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["device_audit"]
