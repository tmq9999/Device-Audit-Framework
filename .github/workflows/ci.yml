name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Run mypy
        run: mypy device_audit
      - name: Run Ruff
        run: ruff check .
      - name: Compile Python sources
        run: python -m compileall -q device_audit device_audit.py
      - name: Check diff whitespace
        run: git diff --check

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify source distribution contents
        run: |
          tar -tzf dist/*.tar.gz | grep -q '/device_audit.py$'
          tar -tzf dist/*.tar.gz | grep -q '/docs/ARCHITECTURE.md$'
          tar -tzf dist/*.tar.gz | grep -q '/profiles/pixel_10_pro_cp1a.json$'
          tar -tzf dist/*.tar.gz | grep -q '/tests/fixtures/bundles/schema_1_0/evidence.json$'
          tar -tzf dist/*.tar.gz | grep -q '/tests/fixtures/bundles/schema_4_0/evidence.json$'
      - name: Create isolated install
        run: python -m venv .package-venv && .package-venv/bin/python -m pip install dist/*.whl
      - name: Verify console entry point
        run: cd /tmp && "$GITHUB_WORKSPACE/.package-venv/bin/device-audit" --help
      - name: Verify module entry point
        run: cd /tmp && "$GITHUB_WORKSPACE/.package-venv/bin/python" -m device_audit --help
